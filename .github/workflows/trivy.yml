name: Trivy — yarilo-autoconfig vulnerability scan

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Table output, no SARIF upload: code scanning is not available for private
# repositories on the organisation's plan.
jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build image for scanning
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: yarilo-autoconfig:scan

      - name: Image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: yarilo-autoconfig:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Filesystem scan (deps + config)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
