apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "yarilo-autoconfig.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "yarilo-autoconfig.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yarilo-autoconfig.selector" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: yarilo-autoconfig
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.httpPort }}"
            - name: METRICS_ADDR
              value: ":{{ .Values.metricsPort }}"
            - name: IMAP_HOST
              value: {{ required "config.imap_host is required" .Values.config.imap_host | quote }}
            - name: SMTP_HOST
              value: {{ required "config.smtp_host is required" .Values.config.smtp_host | quote }}
            {{- range $k, $v := .Values.config }}
            {{- if not (has $k (list "imap_host" "smtp_host")) }}
            - name: {{ upper $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
